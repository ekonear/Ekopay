<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EKOPAY — Bank Permainan</title>
<meta name="description" content="Bank digital untuk malam permainan — bankir bagikan saldo, pemain transfer lewat scan QR.">
<meta name="theme-color" content="#14302A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EKOPAY">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="./config.js"></script>
<style>
  :root{
    --ink: #14302A; --ink-dk: #0C201B; --paper: #EDE3C8; --paper-lt: #F6F0DC;
    --gold: #C9A227; --stamp-red: #A63D40; --leaf: #3F7D5C;
    --text: #1B2620; --muted: rgba(27,38,32,0.58); --line: rgba(27,38,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: var(--ink-dk); background-image: radial-gradient(circle at 20% 0%, rgba(201,162,39,0.10), transparent 45%);
    min-height:100vh; font-family:'Inter', sans-serif; color:var(--text); display:flex; justify-content:center; }
  .shell{ width:100%; max-width:440px; min-height:100vh; background:var(--paper); position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,0.4); }
  .topbar{ background:var(--ink); color:var(--paper-lt); padding:22px 20px 26px; position:relative; overflow:hidden; }
  .topbar::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background-image: radial-gradient(circle at 10px 0, transparent 9px, var(--ink) 9.5px);
    background-size: 20px 14px; background-repeat:repeat-x; }
  .stamp{ position:absolute; top:16px; right:18px; width:56px;height:56px;border-radius:50%;
    border:2px dashed var(--gold); display:flex;align-items:center;justify-content:center; transform:rotate(-10deg);
    font-family:'Fraunces',serif; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gold); text-align:center; line-height:1.1; }
  .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:1.5rem; margin:0 0 2px; }
  .brand-sub{ font-size:0.78rem; color:rgba(246,240,220,0.65); margin:0; }
  .content{ flex:1; padding:24px 20px 100px; position:relative; }
  .center-screen{ display:flex; flex-direction:column; justify-content:center; min-height:calc(100vh - 20px); }
  h1.hero{ font-family:'Fraunces',serif; font-weight:600; font-size:2rem; line-height:1.1; margin:0 0 8px; color:var(--ink); }
  .lede{ color:var(--muted); font-size:0.95rem; margin:0 0 28px; line-height:1.5;}
  .role-card{ display:flex; align-items:center; gap:14px; background:var(--paper-lt); border:1.5px solid var(--line);
    border-radius:14px; padding:18px; margin-bottom:14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease; }
  .role-card:active{ transform:scale(0.98); } .role-card:hover{ border-color:var(--gold); }
  .role-emoji{ font-size:1.8rem; } .role-title{ font-weight:700; font-size:1.02rem; margin:0 0 2px;}
  .role-desc{ font-size:0.82rem; color:var(--muted); margin:0;}
  label.field-label{ display:block; font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=password]{ width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper-lt); font-family:'Inter',sans-serif; font-size:1rem; color:var(--text); margin-bottom:16px; }
  input:focus{ outline:none; border-color:var(--gold); }
  .btn{ display:block; width:100%; text-align:center; padding:14px; border-radius:11px; border:none;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.95rem; cursor:pointer; }
  .btn-primary{ background:var(--ink); color:var(--paper-lt); } .btn-primary:active{ background:var(--ink-dk); }
  .btn-gold{ background:var(--gold); color:var(--ink-dk); }
  .btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn-danger{ background:transparent; color:var(--stamp-red); border:1.5px solid var(--stamp-red); }
  .btn-sm{ padding:8px 14px; font-size:0.82rem; width:auto; border-radius:8px; }
  .btn-row{ display:flex; gap:10px; margin-top:6px; } .btn-row .btn{ flex:1; }
  .balance-block{ text-align:center; padding:6px 0 4px; }
  .balance-label{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:rgba(246,240,220,0.6); margin-bottom:6px;}
  .balance-num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:2.5rem; color:var(--gold); letter-spacing:-0.5px;}
  .owner-name{ font-family:'Fraunces',serif; font-size:1.15rem; margin:2px 0 0; color:var(--paper-lt);}
  .card{ background:var(--paper-lt); border:1.5px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .section-title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.1rem; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between;}
  .section-title small{ font-family:'Inter'; font-weight:600; font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;}
  .player-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px dashed var(--line); }
  .player-row:last-child{ border-bottom:none; }
  .player-name{ font-weight:600; font-size:0.95rem; } .player-id{ font-size:0.72rem; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .player-bal{ font-family:'JetBrains Mono',monospace; font-weight:600; font-size:0.95rem; }
  .tx-row{ display:flex; justify-content:space-between; align-items:flex-start; padding:11px 0; border-bottom:1px dashed var(--line); gap:10px;}
  .tx-row:last-child{ border-bottom:none; } .tx-desc{ font-size:0.86rem; } .tx-desc b{ font-weight:700; }
  .tx-time{ font-size:0.72rem; color:var(--muted); margin-top:2px; }
  .tx-amt{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.95rem; white-space:nowrap;}
  .tx-amt.plus{ color:var(--leaf); } .tx-amt.minus{ color:var(--stamp-red); }
  .empty-note{ color:var(--muted); font-size:0.85rem; text-align:center; padding:20px 10px; }
  .tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px; background:var(--ink);
    display:flex; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .tab-btn{ flex:1; background:none; border:none; color:rgba(246,240,220,0.55); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:'Inter'; font-size:0.68rem; font-weight:600; letter-spacing:0.02em; padding:6px 0; cursor:pointer; border-radius:8px; }
  .tab-btn.active{ color:var(--gold); } .tab-emoji{ font-size:1.2rem; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(12,32,27,0.62); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-card{ background:var(--paper-lt); width:100%; max-width:440px; border-radius:20px 20px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom)); animation:slideUp .18s ease-out; }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.2rem; margin:0 0 4px;}
  .modal-sub{ font-size:0.82rem; color:var(--muted); margin:0 0 18px; }
  .modal-close{ position:absolute; top:16px; right:18px; background:none; border:none; font-size:1.3rem; color:var(--muted); cursor:pointer;}
  .qr-box{ background:white; border-radius:14px; padding:16px; display:flex; justify-content:center; margin-bottom:14px; }
  #reader{ width:100%; border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .target-pill{ display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1.5px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:16px; }
  .link-list{ list-style:none; padding:0; margin:0; }
  .link-item{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px dashed var(--line); cursor:pointer; }
  .link-item:last-child{border-bottom:none;} .link-item:active{ background:rgba(201,162,39,0.1); }
  .toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper-lt); padding:12px 18px;
    border-radius:10px; font-size:0.85rem; font-weight:600; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,0.3); max-width:88%; text-align:center; }
  .toast.err{ background:var(--stamp-red); } .toast.ok{ background:var(--leaf); }
  .hint{ font-size:0.76rem; color:var(--muted); margin-top:-6px; margin-bottom:14px; line-height:1.4;}
  .id-tag{ font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--muted); word-break:break-all; }
  .config-warning{ background:var(--stamp-red); color:#fff; padding:14px 16px; border-radius:12px; font-size:0.82rem; line-height:1.5; margin-bottom:18px; }
  .config-warning code{ background:rgba(255,255,255,0.18); padding:1px 5px; border-radius:4px; }
  .amount-lock{ text-align:center; padding:22px 10px; background:var(--paper); border-radius:12px; margin-bottom:16px; }
  .amount-lock .lbl{ font-size:0.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
  .amount-lock .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:2rem; color:var(--ink); }
</style>
</head>
<body>
<div class="shell" id="shell"><div id="app"></div></div>

<script>
/* ---------------- Firebase REST (tanpa auth) ---------------- */
const CONFIG_OK = typeof FIREBASE_URL === 'string' && FIREBASE_URL.startsWith('https://') && FIREBASE_URL.indexOf('GANTI-DENGAN') === -1;

async function fbGet(path){
  if(!CONFIG_OK) return null;
  try{
    const res = await fetch(`${FIREBASE_URL}/${path}.json`);
    if(!res.ok){ console.error('fbGet gagal:', path, res.status); return null; }
    return await res.json();
  }catch(e){ console.error('fbGet exception:', path, e); return null; }
}
async function fbPut(path, value){
  if(!CONFIG_OK) return false;
  try{
    const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method:'PUT', body: JSON.stringify(value) });
    if(!res.ok){ toast('Gagal menyimpan (status '+res.status+')', 'err'); return false; }
    return true;
  }catch(e){ toast('Gagal menyimpan (koneksi bermasalah)', 'err'); return false; }
}
async function fbPost(path, value){
  if(!CONFIG_OK) return null;
  try{
    const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method:'POST', body: JSON.stringify(value) });
    if(!res.ok){ toast('Gagal menyimpan (status '+res.status+')', 'err'); return null; }
    return await res.json();
  }catch(e){ toast('Gagal menyimpan (koneksi bermasalah)', 'err'); return null; }
}
async function fbDelete(path){
  if(!CONFIG_OK) return false;
  try{
    const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method:'DELETE' });
    if(!res.ok){ toast('Gagal menghapus (status '+res.status+')', 'err'); return false; }
    return true;
  }catch(e){ toast('Gagal menghapus (koneksi bermasalah)', 'err'); return false; }
}

async function getBank(){ return await fbGet('bank'); }
async function setBank(b){ return await fbPut('bank', b); }
async function getBankAuth(){ return await fbGet('bankAuth'); }
async function setBankAuth(a){ return await fbPut('bankAuth', a); }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function getPlayer(id){ return await fbGet('players/'+id); }
async function setPlayer(p){ return await fbPut('players/'+p.id, p); }
async function listPlayers(){
  const obj = await fbGet('players');
  if(!obj) return [];
  // Selalu pakai KEY Firebase sebagai id (bukan field id di dalam datanya),
  // supaya konsisten walau data lama/rusak tidak punya field id.
  const arr = Object.keys(obj).map(key => ({ ...obj[key], id: key }));
  arr.sort((a,b)=> a.name.localeCompare(b.name));
  return arr;
}
async function addTx(tx){ const res = await fbPost('txs', tx); return !!res; }
async function listTx(){
  const obj = await fbGet('txs');
  if(!obj) return [];
  const arr = Object.keys(obj).map(id => ({ id, ...obj[id] }));
  arr.sort((a,b)=> b.time - a.time);
  return arr;
}
async function getPaymentRequest(id){ return await fbGet('paymentRequests/'+id); }
async function listPaymentRequests(){
  const obj = await fbGet('paymentRequests');
  if(!obj) return [];
  const arr = Object.keys(obj).map(id => ({ id, ...obj[id] }));
  arr.sort((a,b)=> b.createdAt - a.createdAt);
  return arr;
}

function slugify(name){
  let s = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  if(!s) s = 'pemain';
  return s;
}
function money(n){ n = Math.round(Number(n)||0); return 'Rp ' + n.toLocaleString('id-ID'); }
function timeAgo(ts){ const d = new Date(ts); return d.toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); }
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' '+kind : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2400);
}

/* ---------------- state ---------------- */
let state = {
  view: 'role', role:null, bank:null, players:[], paymentRequests:[], txs:[],
  me:null, tab:'home', modal:null, scanner:null, transferTarget:null,
};

async function refreshBank(){
  if(state.modal || state.transferTarget) return;
  state.bank = await getBank();
  state.players = await listPlayers();
  state.paymentRequests = await listPaymentRequests();
  state.txs = await listTx();
  render();
}
async function refreshPlayer(){
  if(state.modal || state.transferTarget) return;
  const fresh = await getPlayer(state.me.id);
  if(fresh) state.me = fresh;
  state.players = await listPlayers();
  state.bank = await getBank();
  state.txs = await listTx();
  render();
}
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(state.view === 'bank') refreshBank();
  else if(state.view === 'player') refreshPlayer();
});

/* ---------------- render dispatcher ---------------- */
function render(){
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
  const app = document.getElementById('app');
  if(state.view === 'role') app.innerHTML = viewRole();
  else if(state.view === 'bank-setup') app.innerHTML = viewBankSetup();
  else if(state.view === 'bank-login') app.innerHTML = viewBankLogin();
  else if(state.view === 'bank') app.innerHTML = viewBank();
  else if(state.view === 'player-join') app.innerHTML = viewPlayerJoin();
  else if(state.view === 'player') app.innerHTML = viewPlayer();
  if(state.modal) renderModalInto();
  postRender();
}
function postRender(){
  document.querySelectorAll('[data-qr]').forEach(el=>{
    const content = el.getAttribute('data-qr');
    el.innerHTML = '';
    try{ new QRCode(el, { text: content, width: 190, height: 190, colorDark:"#14302A", colorLight:"#ffffff" }); }catch(e){}
  });
  if(state.modal && state.modal.type === 'scan') startScanner();
}

/* ---------------- ROLE SELECT ---------------- */
function viewRole(){
  const warning = !CONFIG_OK ? `<div class="config-warning">⚠️ Belum terhubung ke database. Lengkapi <code>config.js</code> dulu. Lihat README.md.</div>` : '';
  return `
  <div class="content center-screen">
    ${warning}
    <div class="stamp" style="position:static;transform:rotate(-8deg);width:64px;height:64px;margin-bottom:18px;color:var(--stamp-red);border-color:var(--stamp-red);">SAH<br>MAIN</div>
    <h1 class="hero">EKOPAY</h1>
    <p class="lede">Bank digital buat malam permainan. Bankir bagikan saldo, pemain transfer lewat scan QR — nggak perlu uang kertas.</p>
    <div class="role-card" onclick="goRoleBank()">
      <div class="role-emoji">🏦</div>
      <div><p class="role-title">Saya Bankir</p><p class="role-desc">Buka kas, bagikan saldo, pantau semua transaksi</p></div>
    </div>
    <div class="role-card" onclick="goRolePlayer()">
      <div class="role-emoji">👛</div>
      <div><p class="role-title">Saya Pemain</p><p class="role-desc">Punya dompet sendiri, kirim &amp; terima lewat QR</p></div>
    </div>
    <p class="hint" style="margin-top:10px;">Semua orang yang membuka aplikasi ini akan berbagi kas &amp; saldo yang sama secara langsung.</p>
  </div>`;
}
async function goRoleBank(){
  if(!CONFIG_OK){ toast('Hubungkan database dulu di config.js', 'err'); return; }
  state.bank = await getBank();
  state.view = state.bank ? 'bank-login' : 'bank-setup';
  render();
}
function goRolePlayer(){
  if(!CONFIG_OK){ toast('Hubungkan database dulu di config.js', 'err'); return; }
  state.view = 'player-join';
  render();
}
function backToRole(){ state.view = 'role'; render(); }

/* ---------------- BANK SETUP ---------------- */
function viewBankSetup(){
  return `
  <div class="topbar"><div class="brand">🏦 Buka Kas</div><p class="brand-sub">Tentukan dana awal &amp; akun login bankir</p></div>
  <div class="content">
    <label class="field-label">Dana Awal Bank</label>
    <input type="number" id="initBank" inputmode="numeric" placeholder="contoh: 1000000">
    <label class="field-label">Username Bankir</label>
    <input type="text" id="initUser" placeholder="contoh: bankir1" autocomplete="off">
    <label class="field-label">Password Bankir</label>
    <input type="password" id="initPass" placeholder="minimal 4 karakter" autocomplete="new-password">
    <p class="hint">Username &amp; password ini dipakai untuk masuk sebagai bankir nanti. Simpan baik-baik, tidak ada fitur lupa password.</p>
    <button class="btn btn-primary" onclick="submitBankSetup()">Buka Kas</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="backToRole()">Kembali</button>
  </div>`;
}
async function submitBankSetup(){
  const val = parseInt(document.getElementById('initBank').value, 10);
  const user = document.getElementById('initUser').value.trim();
  const pass = document.getElementById('initPass').value;
  if(!val || val <= 0){ toast('Masukkan jumlah dana yang valid', 'err'); return; }
  if(!user){ toast('Masukkan username bankir', 'err'); return; }
  if(!pass || pass.length < 4){ toast('Password minimal 4 karakter', 'err'); return; }
  state.bank = { balance: val };
  const passwordHash = await sha256(pass);
  const ok1 = await setBank(state.bank);
  const ok2 = await setBankAuth({ username: user, passwordHash });
  if(!ok1 || !ok2) return;
  state.players = await listPlayers();
  state.paymentRequests = await listPaymentRequests();
  state.txs = await listTx();
  state.view = 'bank';
  render();
}

/* ---------------- BANK LOGIN ---------------- */
function viewBankLogin(){
  return `
  <div class="topbar"><div class="brand">🏦 Login Bankir</div><p class="brand-sub">Masuk untuk mengelola kas</p></div>
  <div class="content">
    <label class="field-label">Username</label>
    <input type="text" id="loginUser" placeholder="username bankir" autocomplete="off">
    <label class="field-label">Password</label>
    <input type="password" id="loginPass" placeholder="password" autocomplete="current-password">
    <button class="btn btn-primary" onclick="submitBankLogin()">Masuk</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="backToRole()">Kembali</button>
  </div>`;
}
async function submitBankLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!user || !pass){ toast('Isi username dan password', 'err'); return; }
  const auth = await getBankAuth();
  if(!auth){ toast('Akun bankir belum diatur, hubungi admin', 'err'); return; }
  const passwordHash = await sha256(pass);
  if(auth.username !== user || auth.passwordHash !== passwordHash){
    toast('Username atau password salah', 'err'); return;
  }
  state.players = await listPlayers();
  state.paymentRequests = await listPaymentRequests();
  state.txs = await listTx();
  state.view = 'bank';
  render();
}

/* ---------------- BANK DASHBOARD ---------------- */
function viewBank(){
  const tab = state.tab;
  return `
  <div class="topbar">
    <div class="stamp">SAH<br>BANK</div>
    <div class="brand">🏦 Kas Bankir</div>
    <div class="balance-block" style="text-align:left;padding-top:10px;">
      <div class="balance-label">Saldo Bank</div>
      <div class="balance-num" style="font-size:2.1rem;">${money(state.bank ? state.bank.balance : 0)}</div>
    </div>
  </div>
  <div class="content">
    ${tab === 'home' ? bankHomeTab() : ''}
    ${tab === 'players' ? bankPlayersTab() : ''}
    ${tab === 'qr' ? bankQrTab() : ''}
    ${tab === 'history' ? historyTab(null) : ''}
  </div>
  ${tabbarBank()}`;
}
function tabbarBank(){
  const tabs = [ {id:'home',emoji:'⚙️',label:'Aksi'}, {id:'players',emoji:'👛',label:'Pemain'}, {id:'qr',emoji:'🧾',label:'QR Bayar'}, {id:'history',emoji:'📜',label:'Riwayat'} ];
  return `<div class="tabbar">${tabs.map(t => `
    <button class="tab-btn ${state.tab===t.id?'active':''}" onclick="setBankTab('${t.id}')"><span class="tab-emoji">${t.emoji}</span>${t.label}</button>`).join('')}</div>`;
}
function setBankTab(id){ state.tab = id; render(); refreshBank(); }
async function manualRefreshBank(){ await refreshBank(); toast('Data diperbarui', 'ok'); }

async function submitAddPlayer(){
  const name = document.getElementById('newPlayerName').value.trim();
  if(!name){ toast('Masukkan nama pemain', 'err'); return; }
  let id = slugify(name);
  let existing = await getPlayer(id);
  let i = 2;
  while(existing){ id = slugify(name) + '-' + i; existing = await getPlayer(id); i++; }
  const p = { id, name, balance: 0 };
  const ok = await setPlayer(p);
  if(!ok) return;
  toast('Pemain "'+name+'" ditambahkan', 'ok');
  state.players = await listPlayers();
  state.modal = { type:'addPlayer', success:true, name };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}
async function submitTopup(){
  const id = state.modal.playerId;
  const amt = parseInt(document.getElementById('topupAmt').value, 10);
  if(!amt || amt <= 0){ toast('Masukkan jumlah yang valid', 'err'); return; }
  let bank = await getBank(); if(!bank) bank = { balance: 0 };
  if(bank.balance < amt){ toast('Saldo bank tidak cukup', 'err'); return; }
  const player = await getPlayer(id);
  if(!player){ toast('Pemain tidak ditemukan', 'err'); return; }
  bank.balance -= amt; player.balance += amt;
  const ok1 = await setBank(bank); const ok2 = await setPlayer(player);
  if(!ok1 || !ok2) return;
  const txOk = await addTx({ from:'BANK', fromName:'Bank', to:id, toName:player.name, amount:amt, time:Date.now(), type:'topup' });
  state.bank = bank; state.players = await listPlayers(); state.txs = await listTx();
  toast(txOk ? ('Berhasil isi saldo '+player.name) : 'Saldo terkirim tapi riwayat gagal disimpan', txOk?'ok':'err');
  state.modal = { type:'topup', playerId:id, success:true, amount:amt, playerName:player.name };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}
async function submitFundBank(){
  const amt = parseInt(document.getElementById('fundAmt').value, 10);
  if(!amt || amt <= 0){ toast('Masukkan jumlah yang valid', 'err'); return; }
  let bank = await getBank(); if(!bank) bank = { balance: 0 };
  bank.balance += amt;
  const ok = await setBank(bank);
  if(!ok) return;
  toast('Dana bank ditambahkan', 'ok');
  state.bank = bank;
  state.modal = { type:'fundBank', success:true, amount:amt };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}
async function submitCreatePay(){
  const amt = parseInt(document.getElementById('payAmt').value, 10);
  const label = document.getElementById('payLabel').value.trim();
  if(!amt || amt <= 0){ toast('Masukkan nominal yang valid', 'err'); return; }
  const res = await fbPost('paymentRequests', { amount: amt, label, createdAt: Date.now() });
  toast('QR pembayaran dibuat', 'ok');
  closeModal();
  state.paymentRequests = await listPaymentRequests();
  render();
  if(res && res.name) showPayQr(res.name, label, amt);
}
async function submitDeletePlayer(){
  const id = state.modal.playerId;
  const p = state.players.find(x => x.id === id);
  if(!p){ toast('Pemain tidak ditemukan', 'err'); return; }
  if(p.balance > 0){
    let bank = await getBank(); if(!bank) bank = { balance: 0 };
    bank.balance += p.balance;
    await setBank(bank);
    await addTx({ from:id, fromName:p.name, to:'BANK', toName:'Bank', amount:p.balance, time:Date.now(), type:'account-deleted' });
    state.bank = bank;
  }
  await fbDelete('players/'+id);
  toast('Akun '+p.name+' dihapus', 'ok');
  state.players = await listPlayers();
  state.modal = { type:'deletePlayer', success:true, name:p.name };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}
async function submitDeletePayQr(){
  const id = state.modal.playerId;
  await fbDelete('paymentRequests/'+id);
  toast('QR pembayaran dihapus', 'ok');
  state.paymentRequests = await listPaymentRequests();
  closeModal(); render();
}
async function submitDeleteTx(){
  const id = state.modal.playerId;
  await fbDelete('txs/'+id);
  toast('Riwayat transaksi dihapus', 'ok');
  state.txs = await listTx();
  closeModal(); render();
}
async function submitChangePassword(){
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  if(!newPass || newPass.length < 4){ toast('Password baru minimal 4 karakter', 'err'); return; }
  const auth = await getBankAuth();
  const oldHash = await sha256(oldPass);
  if(!auth || auth.passwordHash !== oldHash){ toast('Password lama salah', 'err'); return; }
  const newHash = await sha256(newPass);
  const ok = await setBankAuth({ username: auth.username, passwordHash: newHash });
  if(!ok) return;
  toast('Password berhasil diganti', 'ok');
  state.modal = { type:'changePassword', success:true };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}
async function submitReset(){
  const pKeys = state.players.map(p=>p.id);
  for(const id of pKeys) await fbDelete('players/'+id);
  await fbDelete('paymentRequests');
  // Akun bankir (saldo) dan riwayat transaksi (txs) sengaja TIDAK dihapus.
  await addTx({ from:'SYSTEM', fromName:'Sistem', to:'SYSTEM', toName:'Sistem', amount:0, time:Date.now(), type:'reset-marker' });
  toast('Permainan direset', 'ok');
  state.players = []; state.paymentRequests = []; state.txs = await listTx(); state.tab = 'home';
  state.modal = { type:'reset', success:true };
  render();
  setTimeout(()=>{ closeModal(); }, 1400);
}

async function submitTransfer(){
  const amt = parseInt(document.getElementById('sendAmt').value, 10);
  if(!amt || amt <= 0){ toast('Masukkan jumlah yang valid', 'err'); return; }
  const me = await getPlayer(state.me.id);
  if(!me){ toast('Gagal mengambil data akunmu, coba lagi', 'err'); return; }
  if(me.balance < amt){ toast('Saldo kamu tidak cukup', 'err'); return; }
  const t = state.transferTarget;
  me.balance -= amt;
  const ok1 = await setPlayer(me);
  if(!ok1) return;
  let toName = 'Bank';
  if(t.type === 'bank'){
    let bank = await getBank(); if(!bank) bank = { balance: 0 };
    bank.balance += amt;
    const okBank = await setBank(bank);
    if(!okBank){ toast('Gagal menambah saldo bank, transfer dibatalkan', 'err'); me.balance += amt; await setPlayer(me); return; }
  } else {
    const target = await getPlayer(t.id);
    if(!target){ toast('Penerima tidak ditemukan', 'err'); me.balance += amt; await setPlayer(me); return; }
    target.balance += amt;
    await setPlayer(target);
    toName = target.name;
  }
  const txOk = await addTx({ from: state.me.id, fromName: me.name, to: t.type==='bank' ? 'BANK' : t.id, toName, amount: amt, time: Date.now(), type:'transfer' });
  state.me = me;
  state.players = await listPlayers();
  state.bank = await getBank();
  state.txs = await listTx();
  toast(txOk ? ('Berhasil kirim ke '+toName) : 'Saldo terkirim tapi riwayat gagal disimpan', txOk?'ok':'err');
  state.transferTarget = { success:true, successMsg: (txOk?'Berhasil kirim ':'Terkirim ')+money(amt)+' ke '+toName };
  render();
  setTimeout(()=>{ state.transferTarget = null; state.tab = 'home'; render(); }, 1600);
}
async function submitPayment(){
  const t = state.transferTarget;
  const fresh = await getPaymentRequest(t.payId);
  if(!fresh){ toast('QR pembayaran tidak berlaku lagi', 'err'); state.transferTarget = null; render(); return; }
  const amt = fresh.amount;
  const me = await getPlayer(state.me.id);
  if(!me){ toast('Gagal mengambil data akunmu, coba lagi', 'err'); return; }
  if(me.balance < amt){ toast('Saldo kamu tidak cukup', 'err'); return; }
  me.balance -= amt;
  const ok1 = await setPlayer(me);
  if(!ok1) return;
  let bank = await getBank(); if(!bank) bank = { balance: 0 };
  bank.balance += amt;
  const okBank = await setBank(bank);
  if(!okBank){ toast('Gagal menambah saldo bank, pembayaran dibatalkan', 'err'); me.balance += amt; await setPlayer(me); return; }
  const txOk = await addTx({ from: state.me.id, fromName: me.name, to: 'BANK', toName: 'Bank', amount: amt, time: Date.now(), type:'payment', label: fresh.label || '' });
  state.me = me; state.bank = bank; state.txs = await listTx();
  toast(txOk ? ('Pembayaran berhasil: '+money(amt)) : 'Saldo terpotong tapi riwayat gagal disimpan', txOk?'ok':'err');
  state.transferTarget = { success:true, successMsg: (txOk?'Pembayaran ':'Terkirim ')+money(amt)+(txOk?' berhasil':'') };
  render();
  setTimeout(()=>{ state.transferTarget = null; state.tab = 'home'; render(); }, 1600);
}

/* ---------------- shared: history + modal ---------------- */
function historyTab(filterId){
  const canDelete = state.view === 'bank';
  let txs = state.txs;
  // Penanda reset permainan hanya relevan di riwayat umum (bankir), bukan riwayat per-pemain.
  if(filterId) txs = txs.filter(t => t.type !== 'reset-marker' && (t.from === filterId || t.to === filterId));
  const rows = txs.slice(0, 60).map(t => {
    if(t.type === 'reset-marker'){
      return `
      <div class="tx-row">
        <div><div class="tx-desc">🔄 <b>Permainan direset</b> — akun pemain &amp; QR dihapus</div><div class="tx-time">${timeAgo(t.time)}</div></div>
        ${canDelete ? `<button class="btn btn-danger btn-sm" style="padding:4px 8px;" onclick="openModal('deleteTx','${t.id}')">🗑️</button>` : ''}
      </div>`;
    }
    const isOut = filterId && t.from === filterId;
    const sign = filterId ? (isOut ? 'minus' : 'plus') : '';
    const prefix = filterId ? (isOut ? '-' : '+') : '';
    const label = t.type === 'payment' && t.label ? ` (${escapeHtml(t.label)})` : '';
    const desc = filterId
      ? (isOut ? `Ke <b>${escapeHtml(t.toName)}</b>${label}` : `Dari <b>${escapeHtml(t.fromName)}</b>${label}`)
      : `<b>${escapeHtml(t.fromName)}</b> → <b>${escapeHtml(t.toName)}</b>${label}`;
    return `
    <div class="tx-row">
      <div><div class="tx-desc">${desc}</div><div class="tx-time">${timeAgo(t.time)}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="tx-amt ${sign}">${prefix}${money(t.amount)}</div>
        ${canDelete ? `<button class="btn btn-danger btn-sm" style="padding:4px 8px;" onclick="openModal('deleteTx','${t.id}')">🗑️</button>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="section-title">Riwayat Transaksi</div>${rows || '<p class="empty-note">Belum ada transaksi.</p>'}</div>`;
}
function openModal(type, playerId){ if(type==='scan') stopScanner(); state.modal = { type, playerId }; render(); }
function closeModal(){ stopScanner(); state.modal = null; render(); }
function renderModalInto(){
  const m = state.modal;
  let inner = '';
  if(m.type === 'addPlayer'){
    if(m.success){ inner = `<div class="modal-title">✅ Pemain Ditambahkan</div><p class="modal-sub">${escapeHtml(m.name)}</p>`; }
    else { inner = `
      <div class="modal-title">Tambah Pemain</div><p class="modal-sub">Pemain baru dimulai dengan saldo 0.</p>
      <label class="field-label">Nama</label><input type="text" id="newPlayerName" placeholder="contoh: Budi" autocomplete="off">
      <button class="btn btn-primary" onclick="submitAddPlayer()">Tambahkan</button>`; }
  } else if(m.type === 'topup'){
    if(m.success){ inner = `<div class="modal-title">✅ Berhasil</div><p class="modal-sub">Saldo ${escapeHtml(m.playerName)} bertambah ${money(m.amount)}.</p>`; }
    else { const p = state.players.find(x => x.id === m.playerId); inner = `
      <div class="modal-title">Isi Saldo ${p ? escapeHtml(p.name) : ''}</div><p class="modal-sub">Saldo saat ini: ${money(p ? p.balance : 0)}</p>
      <label class="field-label">Jumlah</label><input type="number" id="topupAmt" inputmode="numeric" placeholder="contoh: 100000">
      <button class="btn btn-primary" onclick="submitTopup()">Kirim dari Bank</button>`; }
  } else if(m.type === 'fundBank'){
    if(m.success){ inner = `<div class="modal-title">✅ Berhasil</div><p class="modal-sub">Dana bank bertambah ${money(m.amount)}.</p>`; }
    else { inner = `
      <div class="modal-title">Tambah Dana Bank</div><p class="modal-sub">Menambah pool dana yang bisa dibagikan.</p>
      <label class="field-label">Jumlah</label><input type="number" id="fundAmt" inputmode="numeric" placeholder="contoh: 500000">
      <button class="btn btn-primary" onclick="submitFundBank()">Tambahkan</button>`; }
  } else if(m.type === 'createPay'){
    inner = `
      <div class="modal-title">Buat QR Pembayaran</div><p class="modal-sub">Nominal ini akan terkunci saat pemain scan.</p>
      <label class="field-label">Nominal</label><input type="number" id="payAmt" inputmode="numeric" placeholder="contoh: 25000">
      <label class="field-label">Label (opsional)</label><input type="text" id="payLabel" placeholder="contoh: Beli tanah petak 5">
      <button class="btn btn-primary" onclick="submitCreatePay()">Buat QR</button>`;
  } else if(m.type === 'showPayQr'){
    inner = `<div class="modal-title">${escapeHtml(m.label || 'QR Pembayaran')}</div><p class="modal-sub">Nominal: ${money(m.amount)}</p>
      <div class="qr-box" data-qr="WG-PAY:${m.id}"></div><p class="hint" style="margin-bottom:0;">Tunjukkan ke pemain untuk di-scan.</p>`;
  } else if(m.type === 'deletePlayer'){
    if(m.success){ inner = `<div class="modal-title">✅ Akun Dihapus</div><p class="modal-sub">${escapeHtml(m.name)} sudah dihapus.</p>`; }
    else { const p = state.players.find(x => x.id === m.playerId); inner = `
      <div class="modal-title">Hapus Akun ${p ? escapeHtml(p.name) : ''}?</div>
      <p class="modal-sub">${p && p.balance > 0 ? 'Sisa saldo '+money(p.balance)+' akan dikembalikan ke kas bank. ' : ''}Tindakan ini tidak bisa dibatalkan.</p>
      <button class="btn btn-danger" onclick="submitDeletePlayer()">Ya, Hapus Akun</button>`; }
  } else if(m.type === 'deletePayQr'){
    inner = `<div class="modal-title">Hapus QR Pembayaran?</div><p class="modal-sub">QR ini tidak akan bisa dipakai lagi.</p>
      <button class="btn btn-danger" onclick="submitDeletePayQr()">Ya, Hapus QR</button>`;
  } else if(m.type === 'deleteTx'){
    inner = `<div class="modal-title">Hapus Riwayat Transaksi?</div><p class="modal-sub">Catatan ini akan hilang permanen. Saldo tidak ikut berubah.</p>
      <button class="btn btn-danger" onclick="submitDeleteTx()">Ya, Hapus</button>`;
  } else if(m.type === 'reset'){
    if(m.success){ inner = `<div class="modal-title">✅ Permainan Direset</div><p class="modal-sub">Semua akun pemain dan QR pembayaran sudah dihapus. Saldo bank dan riwayat transaksi tetap tersimpan.</p>`; }
    else { inner = `
      <div class="modal-title">Reset Permainan?</div>
      <p class="modal-sub">Semua akun pemain dan QR pembayaran akan dihapus. Akun bankir (saldo) dan riwayat transaksi <b>tidak</b> akan dihapus. Tindakan ini tidak bisa dibatalkan.</p>
      <button class="btn btn-danger" onclick="submitReset()">Ya, Reset Permainan</button>`; }
  } else if(m.type === 'changePassword'){
    if(m.success){ inner = `<div class="modal-title">✅ Password Diperbarui</div><p class="modal-sub">Password bankir berhasil diganti.</p>`; }
    else { inner = `
      <div class="modal-title">Ganti Password Bankir</div>
      <label class="field-label">Password Lama</label><input type="password" id="oldPass" placeholder="password saat ini" autocomplete="current-password">
      <label class="field-label">Password Baru</label><input type="password" id="newPass" placeholder="minimal 4 karakter" autocomplete="new-password">
      <button class="btn btn-primary" onclick="submitChangePassword()">Simpan Password Baru</button>`; }
  } else if(m.type === 'scan'){
    inner = `<div class="modal-title">Pindai QR</div><p class="modal-sub">Arahkan kamera ke QR tujuan.</p>
      <div id="reader"></div><p class="hint" id="scanHint" style="margin-bottom:0;">Meminta izin kamera…</p><div id="scanFallback"></div>`;
  }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal-card" style="position:relative;"><button class="modal-close" onclick="closeModal()">✕</button>${inner}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target.id === 'modalOverlay') closeModal(); });
  document.getElementById('shell').appendChild(overlay);
}

/* ---------------- QR scanner ---------------- */
let scannerStartPromise = null;
function startScanner(){
  const readerEl = document.getElementById('reader');
  if(!readerEl || typeof Html5Qrcode === 'undefined') return;
  const hint = document.getElementById('scanHint');
  try{
    const qr = new Html5Qrcode('reader');
    state.scanner = qr;
    scannerStartPromise = qr.start(
      { facingMode: 'environment' }, { fps: 10, qrbox: 220 },
      (decodedText) => { handleScanResult(decodedText); }, () => {}
    );
    scannerStartPromise.then(()=>{ if(hint) hint.textContent = 'Arahkan kamera ke QR tujuan.'; })
      .catch(()=>{ showScanFallback('Kamera tidak bisa diakses.'); });
  }catch(e){ showScanFallback('Kamera tidak tersedia.'); }
}
function showScanFallback(msg){
  const hint = document.getElementById('scanHint'); const box = document.getElementById('scanFallback');
  if(hint) hint.textContent = msg + ' Pilih tujuan manual di bawah:';
  if(!box) return;
  const others = state.players.filter(p => p.id !== state.me.id);
  const list = others.map(p => `
    <li class="link-item" onclick="pickTargetFromScan('player','${p.id}','${escapeHtml(p.name).replace(/'/g,"\\'")}')">
      <span>👛 ${escapeHtml(p.name)}</span><span class="player-bal">${money(p.balance)}</span></li>`).join('');
  box.innerHTML = `<ul class="link-list" style="margin-top:12px;">
    <li class="link-item" onclick="pickTargetFromScan('bank', null, 'Bank')"><span>🏦 Bank</span><span class="player-bal">${money(state.bank ? state.bank.balance : 0)}</span></li>
    ${list}</ul>`;
}
function pickTargetFromScan(type, id, name){ closeModal(); pickTarget(type, id, name); }
function stopScanner(){
  const qr = state.scanner; state.scanner = null;
  if(!qr) return;
  const doStop = () => { try{ qr.stop().then(()=>{ try{ qr.clear(); }catch(e){} }).catch(()=>{ try{ qr.clear(); }catch(e){} }); }catch(e){} };
  if(scannerStartPromise){ scannerStartPromise.then(doStop).catch(doStop); } else { doStop(); }
  scannerStartPromise = null;
}
async function handleScanResult(text){
  stopScanner(); state.modal = null;
  if(text === 'WG-BANK'){ pickTarget('bank', null, 'Bank'); return; }
  if(text && text.indexOf('WG-PLAYER:') === 0){
    const id = text.replace('WG-PLAYER:', '');
    if(id === state.me.id){ toast('Tidak bisa kirim ke diri sendiri', 'err'); render(); return; }
    const p = await getPlayer(id);
    if(!p){ toast('Pemain tidak ditemukan', 'err'); render(); return; }
    pickTarget('player', id, p.name); return;
  }
  if(text && text.indexOf('WG-PAY:') === 0){
    const id = text.replace('WG-PAY:', '');
    const req = await getPaymentRequest(id);
    if(!req){ toast('QR pembayaran tidak ditemukan', 'err'); render(); return; }
    state.transferTarget = { type:'pay', payId:id, amount:req.amount, label:req.label };
    render(); return;
  }
  toast('QR tidak dikenali', 'err'); render();
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

/* ---------------- init ---------------- */
render();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(()=>{}); });
}
</script>
